name: Build iOS IPA (unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios/HermesVoice && xcodegen generate

      - name: Resolve Swift packages
        run: |
          cd ios/HermesVoice
          xcodebuild -resolvePackageDependencies \
            -project HermesVoice.xcodeproj \
            -scheme HermesVoice

      - name: Build for iOS device (unsigned)
        run: |
          cd ios/HermesVoice
          xcodebuild clean build \
            -project HermesVoice.xcodeproj \
            -scheme HermesVoice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HermesVoice.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            archive

      - name: Export IPA (unsigned)
        working-directory: ios/HermesVoice
        run: |
          set -x
          mkdir -p build/ipa/Payload
          cp -r build/HermesVoice.xcarchive/Products/Applications/HermesVoice.app \
            build/ipa/Payload/
          cd build/ipa
          zip -r HermesVoice-unsigned.ipa Payload
          ls -la HermesVoice-unsigned.ipa
          pwd

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: HermesVoice-unsigned-ipa
          path: ios/HermesVoice/build/ipa/HermesVoice-unsigned.ipa
          retention-days: 30
